# PHASE8.md §9 — 512-player perf regression vs the committed baseline, plus the
# soak. Runs on push to main (not on PRs), so it never gates a PR; failures
# alert post-merge. Manual runs via workflow_dispatch. (Formerly a daily cron;
# moved off the calendar — it only needs to run when main actually changes.)
name: perf

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: 512-player regression
        run: make perf-nightly
      - name: Soak (short window in CI; full 24h is operator-run)
        run: go run scripts/loadtest.go --soak --duration=10m --rotate-every=1m
