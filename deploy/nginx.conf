# PHASE8.md §12.2 — nginx TLS termination + WebSocket reverse proxy for
# isnipes. Replace server_name and the certificate paths.

# Required for the WebSocket Upgrade dance.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Reject unknown Host headers so this server cannot be abused as an open
# redirector / default vhost.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# Redirect plain HTTP to HTTPS for the canonical host. Redirect to the
# CONFIGURED hostname (not $host) so a forged Host cannot produce an
# attacker-controlled redirect target.
server {
    listen 80;
    listen [::]:80;
    server_name game.example.com;
    return 301 https://game.example.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name game.example.com;

    ssl_certificate     /etc/ssl/certs/isnipes.crt;
    ssl_certificate_key /etc/ssl/private/isnipes.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Operational endpoints must never be reachable through the public
    # proxy. They live on the binary's loopback admin listener
    # (127.0.0.1:6060), scraped locally — not via nginx.
    location = /metrics      { return 404; }
    location /debug/pprof     { return 404; }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Longer than the 5s server idle/ping window so live WS sockets are
        # not torn down by the proxy.
        proxy_read_timeout 60s;
    }
}
